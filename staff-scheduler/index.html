        <div class="list" style="margin-bottom:16px">
          <div class="row"><div class="row-m"><div class="row-t">计薪来源</div>
            <div class="row-s">按打卡更准确，按排班更省事</div></div>
            <div class="row-r"><div class="seg"><button data-act="payFrom" data-v="actual" class="${st.payFrom === 'actual' ? 'on' : ''}">实际打卡</button>
              <button data-act="payFrom" data-v="sched" class="${st.payFrom === 'sched' ? 'on' : ''}">按排班</button></div></div></div>
          ${sw('otWeeklyOn', '每周加班（FLSA）', `超过 ${st.otWeekly} 小时按 ${st.otMult} 倍`)}
          ${num('otWeekly', '每周加班门槛', '美国联邦标准为 40 小时', 1, '小时')}
          ${sw('otDailyOn', '每日加班（加州式）', `单日超过 ${st.otDaily} 小时按 ${st.otMult} 倍`)}
          ${num('otDaily', '每日加班门槛', '仅在启用每日加班时生效', 1, '小时')}
          ${num('otMult', '加班倍率', '默认 1.5 倍', 0.25, '×')}
          ${sw('breakUnpaid', '休息时间不计薪', '班次中的休息分钟从工时中扣除')}
          ${num('payerTaxPct', '雇主税费比例', 'FICA 7.65% + 失业保险等', 0.05, '%')}
          ${num('lateGrace', '迟到宽限', '超过这个分钟数才算迟到', 1, '分钟')}
        </div>
      </div>

      <div>
        <div class="sec-t">班次模板</div>
        <div class="list" style="margin-bottom:16px">
          ${DB.templates.map(t => `<div class="row">
            <div class="row-m"><div class="row-t">${esc(t.n)}</div>
              <div class="row-s">${t.start}–${t.end} · 休息 ${t.brk} 分钟 · 计薪 ${hh(shiftMin(t))}h</div></div>
            <div class="row-r"><input class="inp" style="width:104px;height:32px" type="time" data-tpl="${t.id}" data-k="start" value="${t.start}">
              <input class="inp" style="width:104px;height:32px" type="time" data-tpl="${t.id}" data-k="end" value="${t.end}"></div></div>`).join('')}
        </div>

        <div class="sec-t">每日用人需求（自动排班依据）</div>
        <div class="card pad0" style="margin-bottom:16px"><div class="scrollx"><table class="tbl">
          <thead><tr><th>星期</th><th>班段</th>${Object.keys(ROLES).map(r => `<th class="num">${ROLES[r].n}</th>`).join('')}</tr></thead>
          <tbody>${[1, 2, 3, 4, 5, 6, 0].map(d => (DB.demand[d] || []).map((blk, bi) => {
      const t = tplById(blk.tpl);
      return `<tr><td>${DOW_L[d]}</td><td class="dim">${t ? t.n + ' ' + t.start : '?'}</td>
              ${Object.keys(ROLES).map(r => `<td class="num"><input class="inp" style="width:52px;height:28px;text-align:center;padding:0"
                type="number" min="0" max="9" data-dem="${d}|${bi}|${r}" value="${blk.need[r] || 0}"></td>`).join('')}</tr>`;
    }).join('')).join('')}</tbody>
        </table></div></div>

        <div class="sec-t">数据</div>
        <div class="list">
          <div class="row tap" data-act="exportData"><div class="row-m"><div class="row-t">导出全部数据</div>
            <div class="row-s">JSON 备份，可在另一台电脑导入</div></div><span class="chev">›</span></div>
          <div class="row tap" data-act="importData"><div class="row-m"><div class="row-t">导入数据</div>
            <div class="row-s">从 JSON 备份恢复</div></div><span class="chev">›</span></div>
          <div class="row tap" data-act="resetData"><div class="row-m"><div class="row-t" style="color:var(--red)">重置为示例数据</div>
            <div class="row-s">清空当前所有排班、打卡与员工</div></div><span class="chev">›</span></div>
        </div>
        <div class="hint" style="margin-top:12px">数据只保存在这台设备的浏览器里（localStorage），不会上传到任何服务器。</div>
      </div>
    </div>`;
  }
};

/* =========================================================================
   动作
   ========================================================================= */
function download(name, text, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');

const ACT = {
  go: b => go(b.dataset.v),
  wk(b) {
    const d = Number(b.dataset.d);
    state.week = d === 0 ? weekStartOf(TODAY) : addDays(state.week, d * 7);
    render();
  },
  theme() {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('banbiao.theme', next); } catch (e) { }
    toast(`外观：${{ auto: '跟随系统', light: '浅色', dark: '深色' }[next]}`, 'info');
  },
  moreMenu() {
    openSheet({
      title: '更多', body: `<div class="list">
        ${[['staff', '员工', '☺'], ['leave', '请假', '✈'], ['set', '设置', '⚙']].map(([v, n, i]) =>
        `<div class="row tap" data-act="goClose" data-v="${v}"><span style="width:22px">${i}</span>
           <div class="row-m"><div class="row-t">${n}</div></div><span class="chev">›</span></div>`).join('')}</div>`
    });
  },
  goClose: b => { closeSheet(); setTimeout(() => go(b.dataset.v), 60); },
  closeSheet: () => closeSheet(),
  autoWeek() {
    const before = DB.shifts.length;
    const { created, gaps } = autoSchedule(state.week);
    render();
    if (!created.length) toast(gaps.length ? `没有可用的人，还缺 ${gaps.length} 个岗位` : '本周需求已经排满了', gaps.length ? 'warn' : 'info');
    else toast(`已排 ${created.length} 个班次${gaps.length ? ` · 仍缺 ${gaps.length} 人次` : ''}`, gaps.length ? 'warn' : 'ok');
  },
  copyWeek() {
    const src = addDays(state.week, -7), dst = state.week;
    const copy = DB.shifts.filter(x => x.date >= src && x.date <= addDays(src, 6));
    if (!copy.length) return toast('上周没有排班可复制', 'warn');
    let n = 0;
    copy.forEach(x => {
      const date = addDays(x.date, 7);
      if (leaveOn(x.staffId, date)) return;
      if (overlapsExisting(x.staffId, date, x.start, x.end)) return;
      DB.shifts.push(Object.assign({}, x, { id: uid(), date })); n++;
    });
    save(); render(); toast(`已复制 ${n} 个班次（跳过请假与冲突）`);
  },
  clearWeek() {
    const ws = state.week, we = addDays(ws, 6);
    const n = DB.shifts.filter(x => x.date >= ws && x.date <= we).length;
    if (!n) return toast('本周没有排班', 'info');
    confirmSheet('清空本周排班', `将删除 ${fmtMD(ws)} – ${fmtMD(we)} 的 <b>${n}</b> 个班次。打卡记录会保留。`, '清空', () => {
      DB.shifts = DB.shifts.filter(x => x.date < ws || x.date > we);
      save(); render(); toast(`已清空 ${n} 个班次`, 'info');
    });
  },
  newShift(b) {
    const s = staffById(b.dataset.s);
    const tpl = DB.templates[0];
    openShiftEditor({ id: uid(), staffId: b.dataset.s, date: b.dataset.d, start: tpl.start, end: tpl.end, brk: tpl.brk, role: s ? s.roles[0] : 'server', note: '' }, true);
  },
  editShift: b => openShiftEditor(DB.shifts.find(x => x.id === b.dataset.id)),
  openStaff: b => openStaffEditor(b.dataset.id),
  addStaff: () => openStaffEditor(null),
  openTime: b => openTimeSheet(b.dataset.id),
  openSlip: b => openSlip(b.dataset.id),
  openLeave: b => openLeaveEditor(b.dataset.id),
  newLeave: () => openLeaveEditor(null),
  approveLeave(b) {
    const t = DB.timeoff.find(x => x.id === b.dataset.id); if (!t) return;
    t.status = 'approved';
    const clash = DB.shifts.filter(x => x.staffId === t.staffId && x.date >= t.from && x.date <= t.to);
    DB.shifts = DB.shifts.filter(x => !clash.includes(x));
    save(); if (sheetStack.length) closeSheet(); render();
    toast(clash.length ? `已批准 · 取消了 ${clash.length} 个班次，记得补人` : '请假已批准', clash.length ? 'warn' : 'ok');
  },
  rejectLeave(b) {
    const t = DB.timeoff.find(x => x.id === b.dataset.id); if (!t) return;
    t.status = 'rejected'; save(); if (sheetStack.length) closeSheet(); render(); toast('已拒绝该申请', 'info');
  },
  delLeave(b) { DB.timeoff = DB.timeoff.filter(x => x.id !== b.dataset.id); save(); render(); },
  period(b) { DB.settings.period = b.dataset.p; state.payFrom = state.payTo = null; save(); render(); },
  payFrom(b) { DB.settings.payFrom = b.dataset.v; save(); render(); },
  tglSet(b) { const k = b.dataset.k; DB.settings[k] = !DB.settings[k]; save(); render(); },
  fillPunch() {
    const ws = state.week; let n = 0;
    rangeDays(ws, 7).filter(d => d < TODAY).forEach(d => {
      shiftsOf(d).forEach(sh => {
        if (DB.punches.some(p => p.staffId === sh.staffId && p.date === d)) return;
        DB.punches.push({ id: uid(), shiftId: sh.id, staffId: sh.staffId, date: d, in: sh.start, out: sh.end, brk: sh.brk });
        n++;
      });
    });
    save(); render(); toast(n ? `已按排班补录 ${n} 条打卡` : '没有需要补录的缺卡', n ? 'ok' : 'info');
  },
  exportSched() {
    const ws = state.week, days = rangeDays(ws, 7);
    const rows = [['员工', '岗位', ...days.map(d => `${fmtMDs(d)} ${DOW_L[dowOf(d)]}`), '周工时', '预估工资']];
    DB.staff.filter(s => s.active).forEach(s => {
      const wm = weekMinutes(s.id, ws);
      rows.push([s.n, s.roles.map(roleName).join('/'),
      ...days.map(d => shiftsOf(d, s.id).map(x => `${x.start}-${x.end} ${roleName(x.role)}`).join(' / ') || (leaveOn(s.id, d) ? '请假' : '')),
      hh(wm) + 'h', money(wm / 60 * effRate(s))]);
    });
    download(`排班表_${ws}.csv`, toCSV(rows));
    toast('班表已导出');
  },
  exportPay() {
    const [from, to] = payPeriod(); const P = computePayroll(from, to);
    const rows = [['薪资周期', `${from} 至 ${to}`], [],
    ['员工', '岗位', '计薪方式', '费率', '正常工时', '加班工时', '基本工资', '加班费', '小费', '应发合计', '雇主税', '雇主总成本']];
    P.rows.forEach(r => rows.push([r.s.n, r.s.roles.map(roleName).join('/'), r.salaried ? '月薪' : '时薪', r.s.rate,
      hh(r.reg), hh(r.ot), r.base.toFixed(2), r.otPay.toFixed(2), r.tips.toFixed(2), r.gross.toFixed(2),
      r.employer.toFixed(2), r.total.toFixed(2)]));
    rows.push(['合计', '', '', '', hh(P.tot.reg), hh(P.tot.ot), P.tot.base.toFixed(2), P.tot.otPay.toFixed(2),
      P.tot.tips.toFixed(2), P.tot.gross.toFixed(2), P.tot.employer.toFixed(2), P.tot.total.toFixed(2)]);
    download(`薪资_${from}_${to}.csv`, toCSV(rows));
    toast('薪资表已导出');
  },
  printPage: () => window.print(),
  exportData() { download(`班表备份_${TODAY}.json`, JSON.stringify(DB, null, 2), 'application/json'); toast('备份已导出'); },
  importData() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
    i.onchange = () => {
      const f = i.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d.staff || !d.settings) throw 0;
          DB = d; DB.settings = Object.assign(defaultSettings(), DB.settings); DB.tips = DB.tips || {};
          save(); render(); toast('数据已导入');
        } catch (e) { toast('文件格式不正确', 'err'); }
      };
      r.readAsText(f);
    };
    i.click();
  },
  resetData() {
    confirmSheet('重置数据', '将清空当前所有员工、排班、打卡与请假记录，并恢复成示例门店数据。此操作不可撤销。', '重置', () => {
      localStorage.removeItem(LSKEY); seed(); state.week = weekStartOf(TODAY); render(); toast('已重置为示例数据', 'info');
    });
  },
};

/* ---------------- 事件委派 ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.matches('input,select,textarea')) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set !== undefined) {
    const k = el.dataset.set;
    const v = el.type === 'number' ? Number(el.value) : (k === 'weekStart' ? Number(el.value) : el.value);
    DB.settings[k] = v; save();
    if (['weekStart', 'cur', 'biz'].includes(k)) { state.week = weekStartOf(TODAY); render(); }
    else render();
    return;
  }
  if (el.dataset.tpl) {
    const t = tplById(el.dataset.tpl); if (t) { t[el.dataset.k] = el.value; save(); render(); }
    return;
  }
  if (el.dataset.dem) {
    const [d, bi, r] = el.dataset.dem.split('|');
    const need = DB.demand[d][bi].need;
    const v = Number(el.value) || 0;
    if (v) need[r] = v; else delete need[r];
    save(); return;
  }
  if (el.dataset.act === 'setTips') {
    DB.tips[el.dataset.k] = Number(el.value) || 0; save(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (sheetStack.length) return;
  if (e.key === 'ArrowLeft') { state.week = addDays(state.week, -7); render(); }
  if (e.key === 'ArrowRight') { state.week = addDays(state.week, 7); render(); }
  if (e.key === 't') { state.week = weekStartOf(TODAY); render(); }
});
let rzT;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (state.view === 'sched') render(); }, 220); });

/* ---------------- 启动 ---------------- */
(function init() {
  try { const th = localStorage.getItem('banbiao.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { }
  load();
  state.week = weekStartOf(TODAY);
  render();
})();
</script>
</body>
</html>
