    pruneSeen(); save(); closeSheet(); setTimeout(render, 80);
  },
  gotoNotif(b) {
    DB.seenNotif[b.dataset.id] = Date.now(); pruneSeen(); save(); closeSheet();
    const v = b.dataset.v;
    setTimeout(() => { if (state.mode === 'emp') ego(v); else go(v); }, 80);
  },
  punchCode: () => openPunchCode(),
  upPhotoMe: () => pickPhoto(d => { const s = me(); if (!s) return; s.photo = d; save(); render(); }),
  setRegion(b) {
    const r = b.dataset.r; if (r === DB.settings.region) return;
    confirmSheet(t('region.switchTitle'), t('region.switchMsg', { r: t('region.' + r) }), t('c.confirm'), () => {
      applyRegion(r);
      DB.holidays = defaultHolidays(r);
      save(); state.week = weekStartOf(TODAY); render();
      toast(t('region.switched', { r: t('region.' + r) }));
    }, false);
  },
  setPunch(b) { DB.settings.punchMode = b.dataset.v; save(); render(); },
  async useHere() {
    toast(t('punch.geoChecking'), 'info');
    try {
      const p = await getPosition();
      DB.settings.geo = Object.assign({ radius: 150 }, DB.settings.geo, { lat: p.lat, lng: p.lng });
      save(); render(); toast(t('set.locSaved'));
    } catch (e) { toast(t('set.locFail'), 'err'); }
  },
  addHoliday() {
    DB.holidays = DB.holidays || [];
    let d = TODAY;
    while (DB.holidays.some(h => h.d === d)) d = addDays(d, 1);
    DB.holidays.push({ d, n: '' }); save(); render();
  },
  delHoliday(b) { DB.holidays = (DB.holidays || []).filter(h => h.d !== b.dataset.d); save(); render(); },

  /* ---- 员工打卡 ---- */
  clockIn() {
    const s = me(), sh = todayShiftOf(s.id); if (!sh) return;
    punchGate(via => {
      const now = nowHM();
      DB.punches.push({ id: uid(), shiftId: sh.id, staffId: s.id, date: TODAY, in: now, out: null, brk: sh.brk, via });
      save(); render();
      const late = t2m(now) - t2m(sh.start) > DB.settings.lateGrace;
      toast(t('emp.clockInOK', { t: now }) + (late ? ' · ' + t('time.late') : ''), late ? 'warn' : 'ok');
    });
  },
  clockOut() {
    const s = me(), p = punchOf(s.id, TODAY); if (!p) return;
    punchGate(via => {
      p.out = nowHM(); p.outVia = via; save(); render();
      toast(t('emp.clockOutOK', { t: p.out, h: hh(workedMin(s.id, TODAY) || 0) }));
    });
  },
  empLeave: () => openLeaveEditor(null, true),
  viewLeave: b => openLeaveEditor(b.dataset.id, true),

  /* ---- 管理端 ---- */
  moreMenu() {
    const by = notifByView();
    const sub = { staff: '', leave: t('leave.pending'), set: '' };
    openSheet({
      title: t('nav.more'), body: `<div class="list">
        ${[['staff', 'nav.staff', '☺'], ['leave', 'nav.leave', '✈'], ['set', 'nav.set', '⚙']].map(([v, k, i]) =>
        `<div class="row tap" data-act="goClose" data-v="${v}"><span style="width:22px">${i}</span>
           <div class="row-m"><div class="row-t">${t(k)}</div>
             ${by[v] ? `<div class="row-s" style="color:var(--red)">${sub[v]}</div>` : ''}</div>
           ${badgeSpan(by[v] || 0)}<span class="chev">›</span></div>`).join('')}
        <div class="row tap" data-act="goClose" data-v="__emp"><span style="width:22px">👤</span>
          <div class="row-m"><div class="row-t">${t('mode.toEmp')}</div></div><span class="chev">›</span></div>
        </div>`
    });
  },
  goClose: b => {
    const v = b.dataset.v; closeSheet();
    setTimeout(() => { if (v === '__emp') ACT.toEmp(); else go(v); }, 60);
  },
  closeSheet: () => closeSheet(),
  autoWeek() {
    const { created, gaps } = autoSchedule(state.week);
    render();
    if (!created.length) toast(gaps.length ? t('msg.autoNoStaff', { g: gaps.length }) : t('msg.autoFull'), gaps.length ? 'warn' : 'info');
    else toast(gaps.length ? t('msg.autoGap', { n: created.length, g: gaps.length }) : t('msg.autoDone', { n: created.length }),
      gaps.length ? 'warn' : 'ok');
  },
  copyWeek() {
    const src = addDays(state.week, -7);
    const copy = DB.shifts.filter(x => x.date >= src && x.date <= addDays(src, 6));
    if (!copy.length) return toast(t('msg.noCopy'), 'warn');
    let n = 0;
    copy.forEach(x => {
      const date = addDays(x.date, 7);
      if (leaveOn(x.staffId, date)) return;
      if (overlapsExisting(x.staffId, date, x.start, x.end)) return;
      DB.shifts.push(Object.assign({}, x, { id: uid(), date })); n++;
    });
    save(); render(); toast(t('msg.copied', { n }));
  },
  clearWeek() {
    const ws = state.week, we = addDays(ws, 6);
    const n = DB.shifts.filter(x => x.date >= ws && x.date <= we).length;
    if (!n) return toast(t('msg.noWeek'), 'info');
    confirmSheet(t('msg.clearTitle'), t('msg.clearMsg', { n, from: fmtMD(ws), to: fmtMD(we) }), t('sched.clear'), () => {
      DB.shifts = DB.shifts.filter(x => x.date < ws || x.date > we);
      save(); render(); toast(t('msg.cleared', { n }), 'info');
    });
  },
  newShift(b) {
    const s = staffById(b.dataset.s), tpl = DB.templates[0];
    openShiftEditor({ id: uid(), staffId: b.dataset.s, date: b.dataset.d, start: tpl.start, end: tpl.end, brk: tpl.brk, role: s ? s.roles[0] : 'server', note: '' }, true);
  },
  editShift: b => openShiftEditor(DB.shifts.find(x => x.id === b.dataset.id)),
  openStaff: b => openStaffEditor(b.dataset.id),
  addStaff: () => openStaffEditor(null),
  openTime: b => openTimeSheet(b.dataset.id),
  openSlip: b => openSlip(b.dataset.id),
  openLeave: b => openLeaveEditor(b.dataset.id),
  newLeave: () => openLeaveEditor(null),
  approveLeave(b) {
    const x = DB.timeoff.find(y => y.id === b.dataset.id); if (!x) return;
    x.status = 'approved';
    const clash = DB.shifts.filter(y => y.staffId === x.staffId && y.date >= x.from && y.date <= x.to);
    DB.shifts = DB.shifts.filter(y => !clash.includes(y));
    save(); if (sheetStack.length) closeSheet(); render();
    toast(clash.length ? t('leave.okCancel', { n: clash.length }) : t('leave.okMsg'), clash.length ? 'warn' : 'ok');
  },
  rejectLeave(b) {
    const x = DB.timeoff.find(y => y.id === b.dataset.id); if (!x) return;
    x.status = 'rejected'; save(); if (sheetStack.length) closeSheet(); render(); toast(t('leave.rejMsg'), 'info');
  },
  delLeave(b) { DB.timeoff = DB.timeoff.filter(x => x.id !== b.dataset.id); save(); render(); },
  period(b) { DB.settings.period = b.dataset.p; state.payFrom = state.payTo = null; save(); render(); },
  payFrom(b) { DB.settings.payFrom = b.dataset.v; save(); render(); },
  tglSet(b) { const k = b.dataset.k; DB.settings[k] = !DB.settings[k]; save(); render(); },
  fillPunch() {
    const ws = state.week; let n = 0;
    rangeDays(ws, 7).filter(d => d < TODAY).forEach(d => {
      shiftsOf(d).forEach(sh => {
        if (DB.punches.some(p => p.staffId === sh.staffId && p.date === d)) return;
        DB.punches.push({ id: uid(), shiftId: sh.id, staffId: sh.staffId, date: d, in: sh.start, out: sh.end, brk: sh.brk });
        n++;
      });
    });
    save(); render(); toast(n ? t('time.filled', { n }) : t('time.nothing'), n ? 'ok' : 'info');
  },
  exportSched() {
    const ws = state.week, days = rangeDays(ws, 7);
    const rows = [[t('c.staff'), t('c.role'), ...days.map(d => `${fmtMDs(d)} ${DOW_M(dowOf(d))}`), t('time.sched'), t('pay.grossCol')]];
    DB.staff.filter(s => s.active).forEach(s => {
      const wm = weekMinutes(s.id, ws);
      rows.push([s.n, s.roles.map(roleName).join('/'),
      ...days.map(d => shiftsOf(d, s.id).map(x => `${x.start}-${x.end} ${roleName(x.role)}`).join(' / ') || (leaveOn(s.id, d) ? t('c.onLeave') : '')),
      hh(wm) + t('c.hoursShort'), money(wm / 60 * effRate(s))]);
    });
    download(`schedule_${ws}.csv`, toCSV(rows));
    toast(t('msg.schedExported'));
  },
  exportPay() {
    const [from, to] = payPeriod(); const P = computePayroll(from, to);
    const rows = [[t('nav.pay'), `${from} — ${to}`], [],
    [t('c.staff'), t('c.role'), t('pay.method'), t('staff.rate', { c: DB.settings.cur }), t('pay.reg'), t('pay.ot'),
    t('pay.base'), t('pay.otPay'), t('pay.tips'), t('pay.grossCol'), t('pay.taxCol'), t('pay.costCol')]];
    P.rows.forEach(r => rows.push([r.s.n, r.s.roles.map(roleName).join('/'),
    r.salaried ? t('staff.monthly') : t('staff.hourly'), r.s.rate,
      hh(r.reg), hh(r.ot), r.base.toFixed(2), r.otPay.toFixed(2), r.tips.toFixed(2), r.gross.toFixed(2),
      r.employer.toFixed(2), r.total.toFixed(2)]));
    rows.push([t('c.total'), '', '', '', hh(P.tot.reg), hh(P.tot.ot), P.tot.base.toFixed(2), P.tot.otPay.toFixed(2),
      P.tot.tips.toFixed(2), P.tot.gross.toFixed(2), P.tot.employer.toFixed(2), P.tot.total.toFixed(2)]);
    download(`payroll_${from}_${to}.csv`, toCSV(rows));
    toast(t('pay.exported'));
  },
  printPage: () => window.print(),
  exportData() { download(`banbiao_backup_${TODAY}.json`, JSON.stringify(DB, null, 2), 'application/json'); toast(t('set.backupOK')); },
  importData() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
    i.onchange = () => {
      const f = i.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d.staff || !d.settings) throw 0;
          DB = d; DB.settings = Object.assign(defaultSettings(), DB.settings); DB.tips = DB.tips || {};
          migrate(); LANG = DB.settings.lang || LANG;
          save(); render(); toast(t('set.imported'));
        } catch (e) { toast(t('set.importBad'), 'err'); }
      };
      r.readAsText(f);
    };
    i.click();
  },
  resetData() {
    confirmSheet(t('set.resetTitle'), t('set.resetMsg'), t('set.resetData'), () => {
      try { localStorage.removeItem(LSKEY); } catch (e) { }
      seed(); state.week = weekStartOf(TODAY); state.me = null; render(); toast(t('set.resetDone'), 'info');
    });
  },
};

/* 员工端返回管理端的密码闸口（同一台平板给全店用时才需要） */
function askPin() {
  openSheet({
    title: t('pin.title'), sub: t('mode.toBoss'),
    body: `<div class="field"><input class="inp" id="pinInput" type="password" inputmode="numeric" maxlength="6"
      placeholder="${t('pin.ph')}" style="height:54px;font-size:22px;text-align:center;letter-spacing:.35em"></div>`,
    footer: `<button class="btn" data-act="closeSheet">${t('c.cancel')}</button>
             <button class="btn pri" data-act="pinOK">${t('pin.ok')}</button>`,
    onMount(el) {
      const input = $('#pinInput', el);
      setTimeout(() => input.focus(), 250);
      const submit = () => {
        if (input.value !== String(DB.settings.bossPin)) {
          input.value = ''; input.style.borderColor = 'var(--red)';
          return toast(t('pin.wrong'), 'err');
        }
        closeSheet();
        state.mode = 'boss'; lsSet('banbiao.mode', 'boss');
        setTimeout(() => { render(); scrollTop(); }, 60);
      };
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      ACT.pinOK = submit;
    }
  });
}

/* ---------------- 事件委派 ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.matches('input,select,textarea')) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.hol) {
    const h = (DB.holidays || []).find(x => x.d === el.dataset.hol);
    if (h) { h[el.dataset.k] = el.value; save(); render(); }
    return;
  }
  if (el.dataset.set === 'geoRadius') {
    DB.settings.geo = Object.assign({ lat: null, lng: null }, DB.settings.geo, { radius: Number(el.value) || 150 });
    save(); render(); return;
  }
  if (el.dataset.set !== undefined) {
    const k = el.dataset.set;
    const v = el.type === 'number' ? Number(el.value) : (['weekStart', 'restDay'].includes(k) ? Number(el.value) : el.value);
    DB.settings[k] = v; save();
    if (k === 'weekStart') state.week = weekStartOf(TODAY);
    render(); return;
  }
  if (el.dataset.tpl) {
    const x = tplById(el.dataset.tpl); if (x) { x[el.dataset.k] = el.value; save(); render(); }
    return;
  }
  if (el.dataset.dem) {
    const [d, bi, r] = el.dataset.dem.split('|');
    const need = DB.demand[d][bi].need;
    const v = Number(el.value) || 0;
    if (v) need[r] = v; else delete need[r];
    save(); return;
  }
  if (el.dataset.act === 'setTips') {
    DB.tips[el.dataset.k] = Number(el.value) || 0; save(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (sheetStack.length) return;
  if (e.key === 'ArrowLeft') { state.week = addDays(state.week, -7); render(); }
  if (e.key === 'ArrowRight') { state.week = addDays(state.week, 7); render(); }
  if (e.key === 't' || e.key === 'T') { state.week = weekStartOf(TODAY); render(); }
});
let rzT;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (state.mode === 'boss' && state.view === 'sched') render(); }, 220); });

/* ---------------- 启动 ---------------- */
(function init() {
  let savedLang = null, savedMode = null, savedMe = null;
  try {
    const th = localStorage.getItem('banbiao.theme'); if (th) document.documentElement.dataset.theme = th;
    savedLang = localStorage.getItem('banbiao.lang');
    savedMode = localStorage.getItem('banbiao.mode');
    savedMe = localStorage.getItem('banbiao.me');
  } catch (e) { }
  LANG = savedLang && LANGS[savedLang] ? savedLang : 'en';
  load();
  if (savedLang && LANGS[savedLang]) DB.settings.lang = savedLang;
  else LANG = LANGS[DB.settings.lang] ? DB.settings.lang : 'en';
  if (savedMode === 'emp') state.mode = 'emp';
  let savedTok = null;
  try { savedTok = localStorage.getItem('banbiao.meTok'); } catch (e) { }
  const who = savedMe && staffById(savedMe);
  if (who && savedTok && savedTok === pinToken(who)) state.me = savedMe;   // 只有记住过这台设备才免密
  state.week = weekStartOf(TODAY);
  render();
  markViewSeen(state.mode === 'emp' ? state.eview : state.view);
  render();
})();
</script>
